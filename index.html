<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MatKlippet</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 min-h-screen">

<header class="bg-emerald-600 text-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">

        <h1 class="text-3xl font-bold">
            Mat<span class="text-yellow-300">Klippet</span>
        </h1>

        <button
            id="openModal"
            class="bg-yellow-400 text-black px-4 py-2 rounded-lg font-semibold">

            Rapportera erbjudande

        </button>

    </div>
</header>

<main class="max-w-6xl mx-auto p-4">

    <input
        id="searchInput"
        type="text"
        placeholder="Sök produkt..."
        class="w-full p-3 border rounded-lg mb-6">

    <div
        id="dealsGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    </div>

</main>

<!-- MODAL -->

<div
    id="modal"
    class="hidden fixed inset-0 bg-black bg-opacity-50 items-center justify-center">

    <div class="bg-white rounded-xl p-6 w-full max-w-md">

        <h2 class="text-xl font-bold mb-4">
            Nytt erbjudande
        </h2>

        <form id="dealForm">

            <input
                id="title"
                placeholder="Produkt"
                class="w-full border p-2 mb-3 rounded"
                required>

            <input
                id="store"
                placeholder="Butik"
                class="w-full border p-2 mb-3 rounded"
                required>

            <input
                id="price"
                type="number"
                step="0.01"
                placeholder="Pris"
                class="w-full border p-2 mb-3 rounded"
                required>

            <button
                type="submit"
                class="w-full bg-emerald-600 text-white p-3 rounded">

                Spara

            </button>

        </form>

    </div>

</div>

<script>

let deals =
JSON.parse(
    localStorage.getItem("matklippet")
)
||
[
    {
        title: "Gevalia Kaffe",
        store: "Willys",
        price: 39.90
    },

    {
        title: "Bregott 600g",
        store: "ICA Maxi",
        price: 49.90
    },

    {
        title: "Kycklingfilé 1kg",
        store: "Coop",
        price: 79.90
    }
];

function saveDeals(){

    localStorage.setItem(
        "matklippet",
        JSON.stringify(deals)
    );
}

function renderDeals(){

    const search =

    document
    .getElementById("searchInput")
    .value
    .toLowerCase();

    const grid =
    document.getElementById("dealsGrid");

    grid.innerHTML = "";

    deals

    .filter(deal =>

        deal.title
        .toLowerCase()
        .includes(search)

    )

    .forEach(deal => {

        grid.innerHTML += `

        <div
        class="bg-white rounded-xl shadow p-4">

            <h3
            class="font-bold text-lg">

                ${deal.title}

            </h3>

            <p
            class="text-emerald-600">

                ${deal.store}

            </p>

            <p
            class="text-red-600 text-2xl font-bold mt-3">

                ${Number(deal.price).toFixed(2)} kr

            </p>

        </div>

        `;
    });

}

document
.getElementById("searchInput")
.addEventListener(
    "input",
    renderDeals
);

document
.getElementById("openModal")
.addEventListener(
    "click",
    () => {

        const modal =
        document.getElementById("modal");

        modal.classList.remove("hidden");
        modal.classList.add("flex");
    }
);

document
.getElementById("modal")
.addEventListener(
    "click",
    event => {

        if(event.target.id === "modal"){

            const modal =
            document.getElementById("modal");

            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }
    }
);

document
.getElementById("dealForm")
.addEventListener(
    "submit",
    event => {

        event.preventDefault();

        deals.unshift({

            title:
            document
            .getElementById("title")
            .value,

            store:
            document
            .getElementById("store")
            .value,

            price:
            document
            .getElementById("price")
            .value

        });

        saveDeals();

        renderDeals();

        const modal =
        document.getElementById("modal");

        modal.classList.add("hidden");
        modal.classList.remove("flex");

        event.target.reset();
    }
);

renderDeals();

</script>

</body>
</html>
