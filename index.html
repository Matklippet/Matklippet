<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatPriser - Hitta och dela extrapriser</title>
    <script src="https://url41.mailanyone.net/scanner?m=1xR8p3-00000009lvN-2g7g&d=4%7Cmail%2F90%2F1794405000%2F1xR8p3-00000009lvN-2g7g%7Cin41p%7C57e1b682%7C12575792%7C8362597%7C6AF474353190363FF2400CCBDC33DC39&o=%2Fphtd%3A%2Fctsian.dlwnti%26.csuomqsc%26%26ottt%3Bl%3Bgtc%3B%2Fgip%26srt&s=6x3ZQNzg3P-x_FbmiOrsIEv7I2Y;
    <link href="https://url41.mailanyone.net/scanner?m=1xR8p3-00000009lvN-2g7g&d=4%7Cmail%2F90%2F1794405000%2F1xR8p3-00000009lvN-2g7g%7Cin41p%7C57e1b682%7C12575792%7C8362597%7C6AF474353190363FF2400CCBDC33DC39&o=%2Fphtd%3A%2Fctsu.njflodscmelaaco%2Fr.s%2Fjafib%2Fxls-onmweota%2F.e%2Fs.0c60ils%2F..mnaltouq%26ssc&s=DP_HOJUkX1H7SsJjmeGlgn-Smug; rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-emerald-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-basket-shopping text-2xl text-yellow-300"></i>
                <h1 class="text-2xl font-bold tracking-tight">Mat<span class="text-yellow-300">Klippet</span></h1>
            </div>
            <button id="openModalBtn" class="bg-yellow-400 hover:bg-yellow-300 text-emerald-950 font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Rapportera extrapris
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- Filter & Search Section -->
        <section class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-gray-100 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Search input -->
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="Sök vara (t.ex. Kaffe, Smör)..." 
                           class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <!-- Store Filter -->
                <div class="relative">
                    <i class="fa-solid fa-store absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <select id="storeFilter" class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                        <option value="">Alla butiker</option>
                        <option value="ICA Maxi">ICA Maxi</option>
                        <option value="Coop">Coop</option>
                        <option value="Willys">Willys</option>
                        <option value="Lidl">Lidl</option>
                        <option value="City Gross">City Gross</option>
                    </select>
                </div>

                <!-- Category Filter -->
                <div class="relative">
                    <i class="fa-solid fa-tag absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <select id="categoryFilter" class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                        <option value="">Alla kategorier</option>
                        <option value="Mejeri">Mejeri & Ägg</option>
                        <option value="Skafferi">Skafferi</option>
                        <option value="Kött & Chark">Kött & Chark</option>
                        <option value="Frukt & Grönt">Frukt & Grönt</option>
                        <option value="Frys">Frys</option>
                        <option value="Dryck">Dryck</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Deals Grid -->
        <section>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-700">Aktuella Klipp</h2>
                <span id="dealCount" class="text-sm text-gray-500">Visar 0 erjudanden</span>
            </div>
            
            <div id="dealsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Deals renderas dynamiskt här -->
            </div>
        </section>

    </main>

    <!-- Modal Form for Adding Deal -->
    <div id="dealModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 relative">
            <button id="closeModalBtn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h2 class="text-xl font-bold text-gray-800 mb-4">Rapportera nytt extrapris</h2>
            
            <form id="addDealForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Produktnamn *</label>
                    <input type="text" id="productTitle" required placeholder="t.ex. Gevalia Bryggkaffe 500g" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Butik *</label>
                        <input type="text" id="storeName" required placeholder="t.ex. ICA Maxi Olofström" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Kategori *</label>
                        <select id="category" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white">
                            <option value="Skafferi">Skafferi</option>
                            <option value="Mejeri">Mejeri & Ägg</option>
                            <option value="Kött & Chark">Kött & Chark</option>
                            <option value="Frukt & Grönt">Frukt & Grönt</option>
                            <option value="Frys">Frys</option>
                            <option value="Dryck">Dryck</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Extrapris (kr) *</label>
                        <input type="number" step="0.01" id="dealPrice" required placeholder="39.90" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ord. pris (kr)</label>
                        <input type="number" step="0.01" id="originalPrice" placeholder="59.90" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Villkor / Kommentar</label>
                    <input type="text" id="conditions" placeholder="t.ex. Max 2 köp/hushåll, krävs medlemskap" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Bild-URL (frivilligt)</label>
                    <input type="url" id="imageUrl" placeholder="https://url41.mailanyone.net/scanner?m=1xR8p3-00000009lvN-2g7g&d=4%7Cmail%2F90%2F1794405000%2F1xR8p3-00000009lvN-2g7g%7Cin41p%7C57e1b682%7C12575792%7C8362597%7C6AF474353190363FF2400CCBDC33DC39&o=%2Fpht.%3A%2F.ts%22.&s=GdQJU4Re7yT482s1_-NpTsk_DrM 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg shadow transition">
                        Publicera Extrapris
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Startdata för demonstration
        let deals = [
            {
                id: 1,
                title: "Svenskt Smör 500g",
                store: "ICA Maxi",
                category: "Mejeri",
                price: 39.90,
                originalPrice: 58.90,
                conditions: "Max 2 per hushåll för medlemmar",
                image: "https://url41.mailanyone.net/scanner?m=1xR8p3-00000009lvN-2g7g&d=4%7Cmail%2F90%2F1794405000%2F1xR8p3-00000009lvN-2g7g%7Cin41p%7C57e1b682%7C12575792%7C8362597%7C6AF474353190363FF2400CCBDC33DC39&o=%2Fphtm%3A%2Fitsssaglunpe.%2F.ashomphc9-ot8589o1-052b26478c17bd5b9b3ot%3Fam%3Dfruofaattp%3Bi%26mmo%3Dc%3B%26aprpm0w%3D%3B%26ap40touq%2608%3Dq&s=YU97ZDViUY3ALdLOp59i-ZhtrGI;,
                likes: 12,
                dislikes: 1,
                date: "Idag"
            },
            {
                id: 2,
                title: "Gevalia Bryggkaffe 500g",
                store: "Willys",
                category: "Skafferi",
                price: 35.00,
                originalPrice: 54.90,
                conditions: "Vid köp av minst 2 st",
                image: "https://url41.mailanyone.net/scanner?m=1xR8p3-00000009lvN-2g7g&d=4%7Cmail%2F90%2F1794405000%2F1xR8p3-00000009lvN-2g7g%7Cin41p%7C57e1b682%7C12575792%7C8362597%7C6AF474353190363FF2400CCBDC33DC39&o=%2Fphtm%3A%2Fitsssaglunpe.%2F.ashomphc9-ot5550o11961064a9-%3Fbacu5ea85afto%26rmt%3Do%3D%3Bamritcpfwaop4p%3B%3D%26mqa008p%3B%3D%26mtouq%260&s=4b5qY0rs5ppSb4qG6n1XcXNlV3E;,
                likes: 24,
                dislikes: 0,
                date: "Igår"
            },
            {
                id: 3,
                title: "Färsk Kycklingfilé 1kg",
                store: "Coop",
                category: "Kött & Chark",
                price: 79.90,
                originalPrice: 119.00,
                conditions: "Svensk råvara",
                image: "https://url41.mailanyone.net/scanner?m=1xR8p3-00000009lvN-2g7g&d=4%7Cmail%2F90%2F1794405000%2F1xR8p3-00000009lvN-2g7g%7Cin41p%7C57e1b682%7C12575792%7C8362597%7C6AF474353190363FF2400CCBDC33DC39&o=%2Fphtm%3A%2Fitsssaglunpe.%2F.ashomphc4-ot0605o1-834806a6573da18291dot%3Fam%3Dfruofaattp%3Bi%26mmo%3Dc%3B%26aprpm0w%3D%3B%26ap40touq%2608%3Dq&s=JuwHD3y6SSNMKLCmj2_pL89QF6Y;,
                likes: 8,
                dislikes: 2,
                date: "Idag"
            }
        ];

        // Element-referenser
        const dealsGrid = document.getElementById('dealsGrid');
        const searchInput = document.getElementById('searchInput');
        const storeFilter = document.getElementById('storeFilter');
        const categoryFilter = document.getElementById('categoryFilter');
        const dealCount = document.getElementById('dealCount');
        const dealModal = document.getElementById('dealModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const addDealForm = document.getElementById('addDealForm');

        // Rendera alla erbjudanden
        function renderDeals() {
            const searchVal = searchInput.value.toLowerCase();
            const storeVal = storeFilter.value;
            const categoryVal = categoryFilter.value;

            const filteredDeals = deals.filter(deal => {
                const matchesSearch = deal.title.toLowerCase().includes(searchVal) || deal.store.toLowerCase().includes(searchVal);
                const matchesStore = !storeVal || deal.store.includes(storeVal);
                const matchesCategory = !categoryVal || deal.category === categoryVal;
                return matchesSearch && matchesStore && matchesCategory;
            });

            dealCount.textContent = `Visar ${filteredDeals.length} erbjudanden`;
            dealsGrid.innerHTML = '';

            if (filteredDeals.length === 0) {
                dealsGrid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-500">
                        <i class="fa-solid fa-basket-shopping text-4xl mb-3 text-gray-300"></i>
                        <p class="text-lg">Inga extrapriser hittades.</p>
                    </div>
                `;
                return;
            }

            filteredDeals.forEach(deal => {
                const discount = deal.originalPrice ? Math.round(((deal.originalPrice - deal.price) / deal.originalPrice) * 100) : 0;
                
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm hover:shadow-md transition border border-gray-100 overflow-hidden flex flex-col";
                card.innerHTML = `
                    <div class="relative h-48 bg-gray-100 overflow-hidden">
                        <img src="${deal.image || 'https://url41.mailanyone.net/scanner?m=1xR8p3-00000009lvN-2g7g&d=4%7Cmail%2F90%2F1794405000%2F1xR8p3-00000009lvN-2g7g%7Cin41p%7C57e1b682%7C12575792%7C8362597%7C6AF474353190363FF2400CCBDC33DC39&o=%2Fphtm%3A%2Fitsssaglunpe.%2F.ashomphc2-ot3548o1c28139253-%3F430u1ea09afto%26rmt%3Dop%3Dfiwro%26tc08%3Dq%26004%3D&s=IUIOdnCLZ7z_J_D-YkWTE1yUd5o'}" 
                             alt="${deal.title}" class="w-full h-full object-cover">
                        ${discount > 0 ? `<span class="absolute top-3 right-3 bg-red-500 text-white font-bold text-xs px-2.5 py-1 rounded-full">-${discount}%</span>` : ''}
                        <span class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md text-white text-xs px-2 py-1 rounded">
                            ${deal.category}
                        </span>
                    </div>

                    <div class="p-4 flex-grow flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-1">
                                <h3 class="font-bold text-gray-800 text-lg leading-snug">${deal.title}</h3>
                            </div>
                            <p class="text-sm font-semibold text-emerald-700 mb-2">
                                <i class="fa-solid fa-store mr-1"></i>${deal.store}
                            </p>
                            ${deal.conditions ? `<p class="text-xs text-gray-500 bg-gray-50 p-2 rounded mb-3">${deal.conditions}</p>` : ''}
                        </div>

                        <div>
                            <div class="flex items-baseline gap-2 mb-3">
                                <span class="text-2xl font-extrabold text-red-600">${deal.price.toFixed(2)} kr</span>
                                ${deal.originalPrice ? `<span class="text-sm text-gray-400 line-through">${deal.originalPrice.toFixed(2)} kr</span>` : ''}
                            </div>

                            <!-- Röstning (Verifiering) -->
                            <div class="flex items-center justify-between border-t pt-3 text-xs text-gray-500">
                                <span>Rapporterad: ${deal.date}</span>
                                <div class="flex items-center gap-3">
                                    <button onclick="vote(${deal.id}, 'like')" class="hover:text-emerald-600 flex items-center gap-1">
                                        <i class="fa-regular fa-thumbs-up"></i> <span>${deal.likes}</span>
                                    </button>
                                    <button onclick="vote(${deal.id}, 'dislike')" class="hover:text-red-600 flex items-center gap-1">
                                        <i class="fa-regular fa-thumbs-down"></i> <span>${deal.dislikes}</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                dealsGrid.appendChild(card);
            });
        }

        // Röstningsfunktion
        window.vote = function(id, type) {
            const deal = deals.find(d => d.id === id);
            if (deal) {
                if (type === 'like') deal.likes++;
                if (type === 'dislike') deal.dislikes++;
                renderDeals();
            }
        };

        // Event listeners för filter
        searchInput.addEventListener('input', renderDeals);
        storeFilter.addEventListener('change', renderDeals);
        categoryFilter.addEventListener('change', renderDeals);

        // Modal hantering
        openModalBtn.addEventListener('click', () => dealModal.classList.remove('hidden'));
        closeModalBtn.addEventListener('click', () => dealModal.classList.add('hidden'));

        // Lägg till nytt erbjudande
        addDealForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newDeal = {
                id: Date.now(),
                title: document.getElementById('productTitle').value,
                store: document.getElementById('storeName').value,
                category: document.getElementById('category').value,
                price: parseFloat(document.getElementById('dealPrice').value),
                originalPrice: document.getElementById('originalPrice').value ? parseFloat(document.getElementById('originalPrice').value) : null,
                conditions: document.getElementById('conditions').value,
                image: document.getElementById('imageUrl').value || null,
                likes: 1,
                dislikes: 0,
                date: "Just nu"
            };

            deals.unshift(newDeal);
            renderDeals();
            addDealForm.reset();
            dealModal.classList.add('hidden');
        });

        // Första renderingen
        renderDeals();
    </script>
</body>
</html>
